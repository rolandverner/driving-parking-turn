<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a1a19">
<title>Парковка и развороты</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
:root{--surface-0:#f5f4ef;--surface-2:#fff;--bg-neutral:#ebe9e2;--text-primary:#1a1a1a;--text-secondary:#5f5e5a;--text-muted:#888780;--border:rgba(0,0,0,.1);--border-strong:rgba(0,0,0,.22);--bg-accent:#e6f1fb;--text-accent:#185fa5;--border-accent:#378add;--bg-warning:#faeeda;--text-warning:#854f0b;--bg-danger:#fcebeb;--text-danger:#a32d2d;--bg-success:#eaf3de;--text-success:#3b6d11;--radius:8px}
@media (prefers-color-scheme:dark){:root{--surface-0:#1a1a19;--surface-2:#262624;--bg-neutral:#333331;--text-primary:#eeede8;--text-secondary:#b4b2a9;--text-muted:#888780;--border:rgba(255,255,255,.08);--border-strong:rgba(255,255,255,.22);--bg-accent:#0c447c;--text-accent:#b5d4f4;--border-accent:#378add;--bg-warning:#412402;--text-warning:#fac775;--bg-danger:#501313;--text-danger:#f7c1c1;--bg-success:#173404;--text-success:#c0dd97}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--surface-0);color:var(--text-primary);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:820px;margin:0 auto;padding:max(16px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) 40px max(12px,env(safe-area-inset-left))}
h1{font-size:22px;font-weight:500;margin:0}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.sub{color:var(--text-secondary);font-size:14px;margin:4px 0 0}
button,select{font:inherit;font-size:14px;color:var(--text-primary);background:transparent;border:.5px solid var(--border-strong);border-radius:var(--radius);padding:7px 12px;min-height:38px;cursor:pointer;touch-action:manipulation}
button:hover{background:var(--bg-neutral)}
input[type=range]{accent-color:var(--border-accent);height:32px}
#lang{display:flex;gap:4px}
#lang button{min-width:44px}
#lang button.on,.pk-tabs button.on{background:var(--bg-accent);color:var(--text-accent);border-color:var(--border-accent)}
.note{font-size:13px;color:var(--text-muted);margin-top:16px}
.pk-tabs{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.pk-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:8px 0}
.pk-steps{margin:8px 0 0;padding:0;list-style:none;font-size:15px}
.pk-steps li{padding:6px 8px;border-radius:var(--radius);color:var(--text-secondary);display:flex;gap:8px;align-items:baseline}
.pk-steps li.on{background:var(--bg-neutral);color:var(--text-primary)}
.pk-badge{font-size:12px;padding:1px 7px;border-radius:var(--radius);min-width:14px;text-align:center}
@media (max-width:560px){h1{font-size:19px}.pk-tabs{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-left:-12px;margin-right:-12px;padding:0 12px}.pk-tabs::-webkit-scrollbar{display:none}.pk-tabs button{flex:0 0 auto;white-space:nowrap}.pk-steps{font-size:14px}.pk-steps li[data-c="1"]{padding-left:30px!important}#cv{border-radius:8px!important}.legend{margin-left:0!important}}
</style>
</head>
<body>
<main>
<div class="top"><div><h1 id="t-title">Парковка и развороты</h1><p class="sub" id="t-sub"></p></div><div id="lang" role="group" aria-label="Language"></div></div>
<div class="pk-tabs" id="m1"></div><div class="pk-tabs" id="m2"></div><div class="pk-tabs" id="tabs"></div>
<canvas id="cv" style="width:100%;display:block;border-radius:12px;border:.5px solid var(--border);background:var(--surface-2);touch-action:pan-y"></canvas>
<div id="cue" style="visibility:hidden;margin:8px 0 0;padding:8px 12px;border-radius:var(--radius);background:var(--bg-warning);color:var(--text-warning);font-size:14px;display:flex;gap:8px;align-items:center"><i class="ti ti-eye" aria-hidden="true"></i><span>.</span></div>
<div class="pk-row">
<button id="play" aria-label="Pause"><i class="ti ti-player-pause" aria-hidden="true"></i></button>
<button id="rst" aria-label="Restart"><i class="ti ti-refresh" aria-hidden="true"></i></button>
<input type="range" id="scrub" min="0" max="1000" step="1" value="0" style="flex:1;min-width:120px">
<select id="spd"><option value="0.5">0.5x</option><option value="1" selected>1x</option><option value="2">2x</option></select>
</div>
<div class="pk-row" style="font-size:14px;gap:16px">
<span style="display:flex;gap:2px;font-size:22px"><i id="sgL" class="ti ti-arrow-big-left" aria-hidden="true"></i><i id="sgR" class="ti ti-arrow-big-right" aria-hidden="true"></i></span>
<span id="gear" class="pk-badge" style="font-size:14px;font-weight:500;padding:3px 10px">D</span>
<span style="display:flex;align-items:center;gap:6px"><i id="wheel" class="ti ti-steering-wheel" aria-hidden="true" style="font-size:22px;display:inline-block;transition:transform .25s"></i><span id="wtxt"></span></span>
<span class="legend" style="color:var(--text-secondary);font-size:13px;display:flex;gap:12px;margin-left:auto"><span><span style="display:inline-block;width:14px;height:3px;background:#1D9E75;vertical-align:middle"></span> <span id="t-fwd"></span></span><span><span style="display:inline-block;width:14px;height:3px;background:#D85A30;vertical-align:middle"></span> <span id="t-back"></span></span></span>
</div>
<ul class="pk-steps" id="steps"></ul>
<p id="tip" style="font-size:13px;color:var(--text-secondary);margin:10px 0 0;line-height:1.6"></p>
<p class="note" id="t-note"></p>
</main>
<script>
const R=5,DG=Math.PI/180,W=36;
const S={
s0n:['Задом','Задом','Reverse','Tolatva'],
s0a:['Едем по правой полосе, 0,5–1 м от машин','Їдемо правою смугою, 0,5–1 м від машин','Drive in the right lane, 0.5–1 m from parked cars','Haladjunk a jobb sávban, 0,5–1 m-re az autóktól'],
s0ac:['Наши зеркала на одной линии с зеркалами передней машины → стоп','Наші дзеркала на одній лінії з дзеркалами передньої машини → стоп','Our mirrors in line with the front car’s mirrors → stop','A tükreink egy vonalban az elöl álló autó tükreivel → megállás'],
revR:['Задний ход. Руль вправо до упора','Задній хід. Кермо вправо до упору','Reverse. Full lock right','Hátramenet. Kormány teljesen jobbra'],
s0bc:['В левом зеркале полностью видна задняя машина → руль прямо','У лівому дзеркалі повністю видно задню машину → кермо прямо','Rear car fully visible in the left mirror → wheel straight','A bal tükörben teljesen látszik a hátsó autó → kormány egyenesbe'],
s0c:['Колёса прямо, едем назад под углом','Колеса прямо, їдемо назад під кутом','Wheels straight, reverse at an angle','Kerekek egyenesen, tolatás ferdén'],
s0cc:['Передний бампер поравнялся с задним бампером передней машины → руль влево до упора','Передній бампер порівнявся із заднім бампером передньої машини → кермо вліво до упору','Front bumper level with the front car’s rear bumper → full lock left','Az első lökhárító egy vonalban az elöl álló autó hátsó lökhárítójával → kormány teljesen balra'],
s0d:['Руль влево до упора, продолжаем назад','Кермо вліво до упору, продовжуємо назад','Full lock left, keep reversing','Kormány teljesen balra, tovább tolatunk'],
parStop:['Машина параллельна бордюру → стоп, руль прямо','Машина паралельна бордюру → стоп, кермо прямо','Car parallel to the curb → stop, wheel straight','Az autó párhuzamos a szegéllyel → megállás, kormány egyenesbe'],
s0e:['Чуть вперёд — встаём по центру, поворотник выкл.','Трохи вперед — стаємо по центру, поворотник вимк.','Ease forward to center, signal off','Kicsit előre, középre állunk, irányjelző ki'],
s0t:['Поворотник вправо — с момента, как решили парковаться, и до конца манёвра.','Поворотник вправо — з моменту, як вирішили паркуватися, і до кінця маневру.','Right signal on from the moment you decide to park until the end of the manoeuvre.','Jobb irányjelző attól kezdve, hogy parkolni akarunk, a manőver végéig.'],
s1n:['Передом','Передом','Forward','Előre'],
rl:['Едем по правой полосе','Їдемо правою смугою','Drive in the right lane','Haladjunk a jobb sávban'],
s1ac:['Плечи на уровне переднего бампера задней машины → руль вправо до упора','Плечі на рівні переднього бампера задньої машини → кермо вправо до упору','Shoulders level with the rear car’s front bumper → full lock right','A vállunk egy vonalban a hátsó autó első lökhárítójával → kormány teljesen jobbra'],
s1b:['Руль вправо до упора, заходим в карман','Кермо вправо до упору, заходимо в кишеню','Full lock right, enter the gap','Kormány teljesen jobbra, beállunk a résbe'],
s1bc:['Машина под углом ~20° к бордюру → руль прямо','Машина під кутом ~20° до бордюру → кермо прямо','Car at ~20° to the curb → wheel straight','Az autó kb. 20°-os szögben a szegélyhez → kormány egyenesbe'],
s1c:['Колёса прямо, едем вперёд под углом','Колеса прямо, їдемо вперед під кутом','Wheels straight, drive forward at an angle','Kerekek egyenesen, előre ferdén'],
s1cc:['Правый передний угол подходит к бордюру → руль влево до упора','Правий передній кут підходить до бордюру → кермо вліво до упору','Front right corner nears the curb → full lock left','A jobb első sarok a szegélyhez ér → kormány teljesen balra'],
s1d:['Руль влево до упора, доворачиваем','Кермо вліво до упору, довертаємо','Full lock left, finish the turn','Kormány teljesen balra, ráfordulunk'],
s1dc:['Машина почти ровно, вперёд места нет → стоп','Машина майже рівно, попереду місця немає → стоп','Car almost straight, no room ahead → stop','Az autó majdnem egyenes, előre nincs hely → megállás'],
s1e:['Выравнивание: задний ход, руль вправо до упора','Вирівнювання: задній хід, кермо вправо до упору','Straighten: reverse, full lock right','Kiegyenesítés: hátramenet, kormány teljesen jobbra'],
s1ec:['Машина параллельна бордюру → руль прямо','Машина паралельна бордюру → кермо прямо','Car parallel to the curb → wheel straight','Az autó párhuzamos a szegéllyel → kormány egyenesbe'],
s1f:['Колёса прямо, назад — встаём по центру кармана','Колеса прямо, назад — стаємо по центру кишені','Wheels straight, back up to center in the gap','Kerekek egyenesen, hátra a rés közepére'],
s1t:['Передом заезжаем только в длинный карман — минимум 2 машины. Если не хватило места — сдать назад и выровняться.','Передом заїжджаємо лише в довгу кишеню — мінімум 2 машини. Якщо не вистачило місця — здати назад і вирівнятися.','Go in forward only into a long gap — at least 2 car lengths. If space runs out, back up and straighten.','Előre csak hosszú résbe álljunk — legalább 2 autónyi. Ha kevés a hely, tolassunk és egyenesítsünk.'],
free2:['свободно ≈ 2 машины','вільно ≈ 2 машини','free ≈ 2 cars','szabad ≈ 2 autó'],
s2n:['Справа налево передом','Справа наліво передом','Right lane → left side, forward','Jobb sávból balra, előre'],
shL:['Плечи на уровне середины соседней машины → руль влево до упора','Плечі на рівні середини сусідньої машини → кермо вліво до упору','Shoulders level with the middle of the neighbouring car → full lock left','A vállunk a szomszéd autó közepénél → kormány teljesen balra'],
s2b:['Руль влево до упора, пересекаем встречную','Кермо вліво до упору, перетинаємо зустрічну','Full lock left, cross the oncoming lane','Kormány teljesen balra, átkeresztezzük a szemközti sávot'],
inEnd:['Колёса прямо, въезжаем до конца места','Колеса прямо, заїжджаємо до кінця місця','Wheels straight, drive fully into the space','Kerekek egyenesen, beállunk a hely végéig'],
s2t:['Перед поворотом пропускаем встречных. Ориентир — свои плечи напротив середины машины перед нужным местом.','Перед поворотом пропускаємо зустрічних. Орієнтир — свої плечі навпроти середини машини перед потрібним місцем.','Yield to oncoming traffic first. Reference: your shoulders opposite the middle of the car before your space.','Fordulás előtt elengedjük a szembejövőket. Viszonyítás: a vállunk a kiszemelt hely előtti autó közepénél.'],
s3n:['Справа направо передом','Справа направо передом','Right lane → right side, forward','Jobb sávból jobbra, előre'],
s3a:['Едем по правой полосе, поворотник вправо — паркуемся справа','Їдемо правою смугою, поворотник вправо — паркуємося справа','Right lane, right signal — parking on the right','Jobb sáv, jobb irányjelző — jobbra parkolunk'],
s3b:['Поворотник влево — выезжаем на соседнюю полосу, берём больше места','Поворотник вліво — виїжджаємо на сусідню смугу, беремо більше місця','Left signal — move into the next lane for more room','Bal irányjelző — átsorolunk a szomszéd sávba, több hely'],
s3c:['Выравниваемся в соседней полосе','Вирівнюємося в сусідній смузі','Straighten in the next lane','Kiegyenesedünk a szomszéd sávban'],
s3d:['Поворотник вправо, едем прямо','Поворотник вправо, їдемо прямо','Right signal, drive straight','Jobb irányjelző, egyenesen'],
shR:['Плечи на уровне середины соседней машины → руль вправо до упора','Плечі на рівні середини сусідньої машини → кермо вправо до упору','Shoulders level with the middle of the neighbouring car → full lock right','A vállunk a szomszéd autó közepénél → kormány teljesen jobbra'],
s3e:['Руль вправо до упора, заезжаем в место','Кермо вправо до упору, заїжджаємо в місце','Full lock right, turn into the space','Kormány teljesen jobbra, behajtunk a helyre'],
s3t:['Направо передом нужен широкий заход: сначала поворотник влево и уходим в соседнюю полосу, потом поворотник вправо и заезжаем. Иначе задним правым колесом зацепим соседа.','Направо передом потрібен широкий заїзд: спочатку поворотник вліво і йдемо в сусідню смугу, потім поворотник вправо і заїжджаємо. Інакше заднім правим колесом зачепимо сусіда.','Forward into a right-side space needs a wide approach: left signal and move to the next lane first, then right signal and turn in. Otherwise the rear right wheel clips the neighbour.','Jobbra előre széles ív kell: előbb bal irányjelző és átsorolás, aztán jobb irányjelző és beállás. Különben a jobb hátsó kerékkel elkapjuk a szomszédot.'],
s4n:['Справа налево задом','Справа наліво задом','Right lane → left side, reverse','Jobb sávból balra, tolatva'],
past:['Проезжаем нужное место','Проїжджаємо потрібне місце','Drive past the space','Elhaladunk a hely mellett'],
s4b:['Руль влево — уходим под углом','Кермо вліво — йдемо під кутом','Steer left — angle away','Kormány balra — ferdén kiállunk'],
s4c:['Колёса прямо, чуть вперёд под углом','Колеса прямо, трохи вперед під кутом','Wheels straight, a little forward at an angle','Kerekek egyenesen, kicsit előre ferdén'],
s4d:['Задний ход. Руль влево до упора','Задній хід. Кермо вліво до упору','Reverse. Full lock left','Hátramenet. Kormány teljesen balra'],
backEnd:['Колёса прямо, назад до конца места','Колеса прямо, назад до кінця місця','Wheels straight, reverse fully into the space','Kerekek egyenesen, tolatás a hely végéig'],
s4t:['Встаём под углом ~30° к месту. Крутим влево, когда место видно в левом заднем стекле.','Стаємо під кутом ~30° до місця. Крутимо вліво, коли місце видно в лівому задньому склі.','Set up at ~30° to the space. Steer left once the space shows in the left rear window.','Kb. 30°-os szögben állunk a helyhez. Balra kormányzunk, amikor a hely látszik a bal hátsó ablakban.'],
s5n:['Справа направо задом','Справа направо задом','Right lane → right side, reverse','Jobb sávból jobbra, tolatva'],
s5ac:['Плечо на середине второй машины после нужного места → стоп, задний ход, руль вправо до упора','Плече на середині другої машини після потрібного місця → стоп, задній хід, кермо вправо до упору','Shoulder at the middle of the 2nd car after the space → stop, reverse, full lock right','A vállunk a hely utáni második autó közepénél → megállás, hátramenet, kormány teljesen jobbra'],
s5t:['Крутим руль до упора стоя, потом едем назад медленно. Смотрим в правое зеркало на линию и соседа.','Крутимо кермо до упору стоячи, потім їдемо назад повільно. Дивимося в праве дзеркало на лінію і сусіда.','Turn to full lock while stopped, then reverse slowly. Watch the line and the neighbour in the right mirror.','Állva tekerjük végig a kormányt, majd lassan tolatunk. A jobb tükörben figyeljük a vonalat és a szomszédot.'],
s6n:['На перекрёстке (U-turn)','На перехресті (U-turn)','At an intersection (U-turn)','Kereszteződésben (U-turn)'],
s6a:['Едем по своей полосе, поворотник влево','Їдемо своєю смугою, поворотник вліво','Stay in your lane, left signal','Saját sávban, bal irányjelző'],
s6ac:['Подъехали к перекрёстку, встречных нет → чуть вправо','Під’їхали до перехрестя, зустрічних немає → трохи вправо','At the intersection, no oncoming traffic → slightly right','A kereszteződésnél nincs szembeforgalom → kicsit jobbra'],
s6b:['Чуть вправо — уходим к правому краю, расширяем разворот','Трохи вправо — йдемо до правого краю, розширюємо розворот','Slightly right — move to the right edge to widen the turn','Kicsit jobbra — a jobb szélre húzódunk, szélesebb ív'],
s6bc:['Машина под углом ~45° вправо → руль влево до упора','Машина під кутом ~45° вправо → кермо вліво до упору','Car angled ~45° right → full lock left','Az autó kb. 45°-ban jobbra áll → kormány teljesen balra'],
s6c:['Руль влево до упора — большой разворот','Кермо вліво до упору — великий розворот','Full lock left — big turn','Kormány teljesen balra — nagy ív'],
s6d:['Руль чуть вправо — выравниваемся в свою полосу','Кермо трохи вправо — вирівнюємося у свою смугу','Slightly right — straighten into your lane','Kormány kicsit jobbra — beállunk a sávunkba'],
goOn:['Колёса прямо, едем дальше','Колеса прямо, їдемо далі','Wheels straight, drive on','Kerekek egyenesen, tovább'],

const i=Math.min(P.fr.length-1,Math.round(d/0.05));const f=P.fr[i];return {...f,moving:t<sc.A||(t>=sc.st[c.o]&&i<P.fr.length-1),gone:i>=P.fr.length-1,go:t>=sc.st[c.o]}}
function mscene(sc){const road=V('--bg-neutral'),ln=V('--text-muted'),bd=V('--border-strong');cx.clearRect(-1,-6,W+2,50);cx.fillStyle=road;cx.fillRect(0,8.5,W,7);
if(sc.lay2==='t3')cx.fillRect(14.5,15.5,7,9);else cx.fillRect(14.5,-1,7,26);
cx.strokeStyle=bd;cx.lineWidth=0.2;cx.beginPath();cx.moveTo(0,15.5);cx.lineTo(14.5,15.5);cx.lineTo(14.5,25);cx.moveTo(21.5,25);cx.lineTo(21.5,15.5);cx.lineTo(W,15.5);
if(sc.lay2==='t3'){cx.moveTo(0,8.5);cx.lineTo(W,8.5)}else{cx.moveTo(0,8.5);cx.lineTo(14.5,8.5);cx.lineTo(14.5,-1);cx.moveTo(21.5,-1);cx.lineTo(21.5,8.5);cx.lineTo(W,8.5)}cx.stroke();
hl(12,0,14.5,1,ln);hl(12,21.5,W,1,ln);cx.strokeStyle=ln;cx.lineWidth=0.12;cx.setLineDash([1.5,1.2]);cx.beginPath();cx.moveTo(18,15.5);cx.lineTo(18,25);if(sc.lay2!=='t3'){cx.moveTo(18,-1);cx.lineTo(18,8.5)}cx.stroke();cx.setLineDash([]);
if(sc.tramL){cx.strokeStyle=bd;cx.lineWidth=0.1;[11.3,12.7].forEach(y=>{cx.beginPath();cx.moveTo(0,y);cx.lineTo(W,y);cx.stroke()})}
cx.fillStyle=V('--text-secondary');cx.font=fpx(0.7)+'px system-ui,sans-serif';cx.fillText(tr('mNone'),CAMX+0.6,1.2)}
function tramDraw(x,y,t){cx.save();cx.translate(x,y);cx.rotate(t);cx.fillStyle='#EF9F27';rr(-1,-1.2,15,2.4,0.4);cx.fill();cx.fillStyle='rgba(255,255,255,0.6)';for(let i=0;i<5;i++)cx.fillRect(0.5+i*2.7,-0.9,1.8,0.4),cx.fillRect(0.5+i*2.7,0.5,1.8,0.4);cx.restore()}
function badge(x,y,n,on){cx.beginPath();cx.arc(x,y,0.8,0,7);cx.fillStyle=on?AM:V('--surface-2');cx.fill();cx.strokeStyle=on?AM:V('--border-strong');cx.lineWidth=0.08;cx.stroke();cx.fillStyle=on?'#412402':V('--text-primary');cx.font='500 '+fpx(0.95)+'px system-ui,sans-serif';cx.textAlign='center';cx.textBaseline='middle';cx.fillText(n,x,y+0.05);cx.textAlign='start';cx.textBaseline='alphabetic'}
function mdraw(){const sc=SC[cur],p=P[cur];const me=sc.cars.find(c=>c.me);const mp=mpose(sc,me,tm);
const v=VY.x4;CAMX=VW>=W?0:Math.min(W-VW,Math.max(0,XC-VW/2));cx.setTransform(DPR*SCL,0,0,DPR*SCL,0,0);cx.translate(-CAMX,-v[0]);mscene(sc);
const cur_ph=sc.phs.filter(q=>tm>=q.T0).pop();const ao=cur_ph&&!cur_ph.cue?cur_ph.o:-1;
sc.cars.forEach(c=>{const f=mpose(sc,c,tm);if(f.gone)return;if(c.tram)tramDraw(f.x,f.y,f.t);else car(f.x,f.y,f.t,c.me?'#378ADD':'#888780',f.go?f.s:0,f.r,false,true,c.g);
const bx=f.x+Math.cos(f.t)*1.25,by=f.y+Math.sin(f.t)*1.25;badge(bx+(c.tram?0:0),by-(c.tram?2:0)+0,c.o,c.o===ao)});
document.querySelectorAll('#steps li').forEach(li=>{li.classList.toggle('on',cur_ph&&+li.dataset.i===sc.phs.indexOf(cur_ph))});
const cb=document.getElementById('cue');cb.style.visibility=cur_ph&&cur_ph.cue?'visible':'hidden';cb.querySelector('span').textContent=cur_ph&&cur_ph.cue?tr(cur_ph.t):'.';
['sgL','sgR'].forEach(id=>{const on=me.g===(id==='sgL'?'L':'R');document.getElementById(id).style.color=on?(blink()?AM:'var(--text-muted)'):'var(--border-strong)'});
const g=document.getElementById('gear');g.textContent='D';g.style.background='var(--bg-success)';g.style.color='var(--text-success)';
document.getElementById('wheel').style.transform='rotate('+((mp.go?mp.s:0)*120)+'deg)';document.getElementById('wtxt').textContent=!mp.go||!mp.s?tr('wS'):tr(mp.s>0?'wR':'wL');
document.getElementById('scrub').value=Math.min(1000,Math.round(tm/p.T*1000))}
function msteps(i){const sc=SC[i];const ul=document.getElementById('steps');ul.innerHTML='';sc.phs.forEach((q,j)=>{const li=document.createElement('li');li.dataset.i=j;li.innerHTML=(q.cue?'<i class="ti ti-eye" aria-hidden="true" style="color:'+AM+'"></i>':'<span class="pk-badge" style="background:var(--bg-neutral);color:var(--text-primary);border-radius:50%">'+q.o+'</span>')+'<span>'+tr(q.t)+'</span>';li.style.cursor='pointer';li.onclick=()=>{tm=q.T0+0.01;setPlay(false);draw()};ul.appendChild(li)});document.getElementById('tip').textContent=tr(sc.tip);draw()}

function setLang(i){L=i;try{localStorage.setItem('pk-lang',LANGS[i])}catch(e){}document.documentElement.lang=LANGS[i];document.querySelectorAll('#lang button').forEach((b,j)=>b.className=j===i?'on':'');['title','sub','note','fwd','back'].forEach(k=>{const e=document.getElementById('t-'+k);if(e)e.textContent=tr(k)});document.title=tr('title');const keep=tm;setSc(cur);tm=keep;menu();draw()}
(function(){const q=new URLSearchParams(location.search).get('lang');let s=null;try{s=localStorage.getItem('pk-lang')}catch(e){}const n=(navigator.language||'ru').slice(0,2);const c=[q,s,n].find(x=>LANGS.includes(x));L=c?LANGS.indexOf(c):0;
const el=document.getElementById('lang');LANGS.forEach((x,i)=>{const b=document.createElement('button');b.textContent=x.toUpperCase();b.onclick=()=>setLang(i);el.appendChild(b)})})();
size();setSc(0);menu();setLang(L);requestAnimationFrame(loop);
try{window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{cs=getComputedStyle(document.documentElement);draw()})}catch(e){}
